<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMI Calculator | Coded by Sumit</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="container">
        <div class="calculator-box">
            <h1>BMI Calculator</h1>
            <p class="subtitle">Coded by Sumit</p>

            <div class="input-group">
                <label>Height (cm)</label>
                <input type="number" id="height" placeholder="Enter height">
            </div>

            <div class="input-group">
                <label>Weight (kg)</label>
                <input type="number" id="weight" placeholder="Enter weight">
            </div>

            <button id="btn">Calculate BMI</button>

            <div id="result-container" class="hidden">
                <div id="result-value">00.0</div>
                <p id="result-status">Normal</p>
            </div>

            <div class="guide">
                <span>Underweight: < 18.6</span>
                        <span>Normal: 18.6 - 24.9</span>
                        <span>Overweight: > 24.9</span>
            </div>
        </div>
    </div>
    <script src="script.js"></script>
</body>

</html>
